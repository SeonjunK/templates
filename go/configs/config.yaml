server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 5m
  shutdown_timeout: 30s

database:
  # e.g. "postgres://user:pass@localhost:5432/mydb?sslmode=disable"
  # Override via DATABASE_DSN environment variable
  dsn: ""
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 1h

logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json, text
